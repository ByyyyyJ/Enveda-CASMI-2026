[project]
name = "casmi2026"
version = "0.1.0"
description = "Reproducible local workflow for Enveda CASMI 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "kaggle>=2.2.4",
    "matchms>=0.30",
    "ms-entropy>=1.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyteomics>=4.7",
    "pytest>=8.3",
    # Pinned to the version used by the official CASMI metric; tautomer canonicalization differs across releases.
    "rdkit==2026.3.3",
    "ruff>=0.6",
    "torch==2.7.0",
    "torchmetrics>=1.5",
    "tqdm>=4.66",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
